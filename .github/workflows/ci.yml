name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          architucture: x64
          cache: maven
      - run: mvn --batch-mode --update-snapshots verify
